<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0b0d10;overflow:hidden}canvas{display:block}
#tag{position:fixed;top:48px;left:64px;font:600 26px/1 Inter,Helvetica,Arial,sans-serif;letter-spacing:.18em;color:#fff;opacity:.85}
#tag span{display:inline-block;background:#e0312e;padding:8px 12px;margin-right:12px}
#label{position:fixed;left:64px;bottom:72px;font:900 86px/1 Anton,Impact,Helvetica,Arial,sans-serif;color:#fff;letter-spacing:.02em;opacity:0;transform:translateY(20px)}
#label b{color:#e0312e}
#sub{position:fixed;left:64px;bottom:40px;font:500 22px/1 Inter,Helvetica,Arial,sans-serif;color:#cfd3d8;opacity:0;letter-spacing:.08em}
</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<div id="tag"><span>ILLUSTRATION</span>AI INVESTMENT · 2023–2026</div>
<div id="label">AI BUBBLE <b>?</b></div>
<div id="sub">VALUATIONS vs REVENUE · ILLUSTRATIVE, NOT TO SCALE</div>
<script type="module">
import * as THREE from 'three';
const W=1920,H=1080,FPS=30,DUR=6;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H); renderer.setPixelRatio(1); renderer.shadowMap.enabled=true; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.1;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0b0d10); scene.fog=new THREE.FogExp2(0x0b0d10,0.045);
const cam=new THREE.PerspectiveCamera(38,W/H,0.1,200);
scene.add(new THREE.AmbientLight(0xffffff,0.25));
const key=new THREE.DirectionalLight(0xffffff,2.2); key.position.set(6,12,6); key.castShadow=true; key.shadow.mapSize.set(2048,2048); scene.add(key);
const rim=new THREE.PointLight(0xe0312e,40,30); rim.position.set(-6,4,-4); scene.add(rim);
const fill=new THREE.PointLight(0x4a7bd6,25,30); fill.position.set(8,3,-6); scene.add(fill);
// floor grid
const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0x14171c,roughness:0.9,metalness:0.1}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
const grid=new THREE.GridHelper(80,80,0x2a2f37,0x1c2026); grid.position.y=0.01; scene.add(grid);
// bars: revenue (grey) vs valuation (red), 4 years
const years=4, bars=[];
for(let i=0;i<years;i++){
  const x=(i-1.5)*2.6;
  const rev=new THREE.Mesh(new THREE.BoxGeometry(0.9,1,0.9),new THREE.MeshStandardMaterial({color:0xd9dde3,roughness:0.5}));
  const val=new THREE.Mesh(new THREE.BoxGeometry(0.9,1,0.9),new THREE.MeshStandardMaterial({color:0xe0312e,roughness:0.35,emissive:0x5a0f0e,emissiveIntensity:0.6}));
  rev.position.x=x-0.55; val.position.x=x+0.55; rev.castShadow=val.castShadow=true;
  scene.add(rev,val); bars.push({rev,val,hRev:0.6+i*0.35,hVal:1.2+i*i*0.9});
}
// bubble
const bubble=new THREE.Mesh(new THREE.SphereGeometry(1,96,96),new THREE.MeshPhysicalMaterial({color:0xffffff,transmission:0.95,thickness:0.6,roughness:0.05,ior:1.2,iridescence:0.9,iridescenceIOR:1.3,transparent:true,opacity:0.9}));
bubble.position.set(2.5,0,0); scene.add(bubble);
// particles
const pg=new THREE.BufferGeometry(); const N=400; const pos=new Float32Array(N*3);
for(let i=0;i<N;i++){pos[i*3]=(Math.random()-0.5)*40;pos[i*3+1]=Math.random()*12;pos[i*3+2]=(Math.random()-0.5)*40;}
pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0x9aa3ad,size:0.06,transparent:true,opacity:0.6})); scene.add(pts);
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
const label=document.getElementById('label'),sub=document.getElementById('sub');
window.renderFrame=function(f){
  const t=f/FPS;
  // camera dolly + orbit
  const a=-0.55+t*0.12; const r=13-t*0.6;
  cam.position.set(Math.sin(a)*r,4.2-t*0.15,Math.cos(a)*r); cam.lookAt(0.6,1.8,0);
  bars.forEach((b,i)=>{
    const k=ease((t-0.3-i*0.35)/1.1);
    const hr=Math.max(0.02,b.hRev*k), hv=Math.max(0.02,b.hVal*k);
    b.rev.scale.y=hr; b.rev.position.y=hr/2; b.val.scale.y=hv; b.val.position.y=hv/2;
  });
  const bk=ease((t-2.2)/2.6); const s=0.01+bk*3.4; bubble.scale.setScalar(s); bubble.position.y=0.5+bk*4.2+Math.sin(t*2)*0.08*bk;
  bubble.material.opacity=0.9-bk*0.25; bubble.rotation.y=t*0.3;
  pts.rotation.y=t*0.02;
  const lk=ease((t-3.6)/0.7); label.style.opacity=lk; label.style.transform=`translateY(${20-20*lk}px)`;
  sub.style.opacity=ease((t-4.1)/0.6);
  renderer.render(scene,cam);
  return true;
};
window.__ready=true;
</script></body></html>
